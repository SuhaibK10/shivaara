<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Gifts | Shivara</title>
  <meta name="theme-color" content="#5b1a35">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shivara">
  <meta property="og:title" content="Shop Gifts | Shivara">
  <meta property="og:description" content="Hampers, festive gifts, candles, keepsakes and corporate gifting, hand-wrapped and delivered across India.">
  <meta property="og:url" content="https://shivaara.vercel.app/collection.html">
  <meta property="og:image" content="https://shivaara.vercel.app/assets/img/og-image.jpg">
  <meta property="og:image:secure_url" content="https://shivaara.vercel.app/assets/img/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Shivara: festive hampers, diyas, roses and candle gift boxes">
  <meta property="og:locale" content="en_IN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shop Gifts | Shivara">
  <meta name="twitter:description" content="Hampers, festive gifts, candles, keepsakes and corporate gifting, hand-wrapped and delivered across India.">
  <meta name="twitter:image" content="https://shivaara.vercel.app/assets/img/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="collection">
  <div id="site-header" class="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <nav class="crumbs"><a href="index.html">Home</a> / <span id="crumb">Shop All</span></nav>
        <h1 id="col-title">Shop All</h1>
        <p id="col-blurb" class="muted"></p>
      </div>
    </section>

    <section class="container collection">
      <aside class="filters" id="filters" aria-label="Filters">
        <div class="filters-head">
          <h3>Filter</h3>
          <button class="link" id="clear-filters">Clear all</button>
        </div>
        <fieldset>
          <legend>Occasion</legend>
          <div id="f-occasion"></div>
        </fieldset>
        <fieldset>
          <legend>Price</legend>
          <label><input type="radio" name="price" value="all" checked> Any price</label>
          <label><input type="radio" name="price" value="0-999"> Under ₹1,000</label>
          <label><input type="radio" name="price" value="1000-1999"> ₹1,000 – ₹1,999</label>
          <label><input type="radio" name="price" value="2000-99999"> ₹2,000 & above</label>
        </fieldset>
        <fieldset>
          <legend>More</legend>
          <label><input type="checkbox" id="f-sale"> On sale</label>
          <label><input type="checkbox" id="f-new"> New arrivals</label>
        </fieldset>
        <button class="btn btn-primary btn-block only-mobile" id="apply-filters">Show results</button>
      </aside>

      <div class="results">
        <div class="toolbar">
          <button class="btn btn-outline only-mobile" id="open-filters">Filter</button>
          <span id="result-count" class="muted"></span>
          <label class="sort">Sort
            <select id="sort">
              <option value="featured">Featured</option>
              <option value="best">Bestselling</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
              <option value="rating">Top rated</option>
            </select>
          </label>
        </div>
        <div class="grid" id="product-grid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/collection.js"></script>
</body>
</html>
